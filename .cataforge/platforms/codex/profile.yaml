platform_id: codex
display_name: Codex CLI
version_tested: "2026.07"

tool_map:
  file_read: {tool: shell, kind: replacement}
  file_write: {tool: apply_patch, kind: native}
  file_edit: {tool: apply_patch, kind: native}
  file_glob: {tool: shell, kind: replacement}
  file_grep: {tool: shell, kind: replacement}
  shell_exec:
    tool: shell
    kind: native
    hook_matchers: [Bash]
  web_search: {tool: web_search, kind: native}
  web_fetch: {tool: shell, kind: replacement}
  user_question:
    tool: request_user_input
    kind: native
    hook_matchers: [request_user_input]
    availability:
      any_of:
        - thread_scopes: [root]
          collaboration_modes: [plan]
        - thread_scopes: [root]
          collaboration_modes: [default]
          required_features: [default_mode_request_user_input]
  agent_dispatch: {tool: spawn_agent, kind: native}

extended_capabilities:
  notebook_edit: {tool: null, kind: unsupported}
  browser_preview: {tool: null, kind: unsupported}
  image_input: {tool: image, kind: native}
  code_review: {tool: review, kind: native}

agent_definition:
  format: toml
  scan_dirs:
    - .codex/agents
  needs_deploy: true

skill_definition:
  # open agent skills 标准：Codex 扫描 $CWD→repo 根的 .agents/skills 逐级目录，
  # 故 target 逸出 .codex/ 命名空间（见 platform-adaptation.md §6 例外声明）。
  target_dir: .agents/skills
  needs_deploy: true

command_definition:
  # Codex custom prompts（~/.codex/prompts）已被官方弃用，命令面由 skills 承接；
  # 可复用指令一律走 skill_definition 部署。
  needs_deploy: false

agent_config:
  tool_policy: inherit_only
  supported_fields:
    - name
    - description
    - model
    - model_reasoning_effort
    - sandbox_mode
    - nickname_candidates
  memory_scopes: []
  isolation_modes: []

instruction_file:
  reads_claude_md: false
  targets:
    - type: project_state_copy
      path: AGENTS.md
      # 三平台 (cursor/codex/opencode) 共享 AGENTS.md — section-merge +
      # always_overwrite_fields.运行时 确保当前平台 deploy 时'运行时:' 字段
      # 反映当前平台, 不被前一次其他平台的 deploy 抢占。
      update_strategy: section-merge
      section_policy:
        framework: [文档导航, 框架机制]
        schema:    [项目信息, 全局约定]
        runtime:   [项目状态, 执行环境]
        user_extensible: true
        always_overwrite_fields:
          项目信息: [运行时, 框架版本]
          全局约定: [设计工具]
  additional_outputs: []

dispatch:
  tool_name: spawn_agent
  is_async: true
  params: [agent_type, message, task_name]

hooks:
  config_format: json
  config_path: .codex/hooks.json
  # 非托管 hook 须用户在 Codex 内 /hooks 审查信任（按定义 hash 记录，redeploy
  # 改动 hook 后需重新信任），未信任的 hook 静默不执行；自动化场景可用
  # --dangerously-bypass-hook-trust。项目级 hooks 仅在项目 .codex/ 层受信时加载。
  entry_type: command
  event_map:
    PreToolUse: PreToolUse
    PostToolUse: PostToolUse
    Stop: Stop
    SessionStart: SessionStart
    Notification: PermissionRequest
  policies:
    guard_dangerous: {mode: native}
    guard_frozen_docs: {mode: native}
    log_agent_dispatch: {mode: native}
    validate_agent_result: {mode: native}
    lint_format: {mode: native}
    detect_correction:
      mode: hybrid
      fallback:
        strategy: prompt_instruction
        coverage: partial
        reason: "结构化检测仅覆盖 root thread 的 request_user_input；直接文本纠偏需人工记录"
        asset: fallbacks/correction-record.md
    detect_review_flag: {mode: native}
    notify_done: {mode: native}
    notify_permission: {mode: native}
    session_context: {mode: native}
    deploy_drift: {mode: native}
    git_sync: {mode: native}

features:
  cloud_agents: true             # codex cloud — background parallel tasks
  agent_teams: false
  parallel_agents: true          # cloud --attempts best-of-N + 本地 spawn_agent 并行
  scheduled_tasks: false
  background_agents: true
  subagent_interactive: false    # 子代理审批请求可浮出主线程，但无用户提问通道
  plan_mode: true                # plan 权限模式 + 内置 plan skill
  computer_use: true             # native computer use capability
  realtime_voice: true           # WebRTC v2 voice sessions
  multi_model: true              # /model command, mid-session switch
  session_resume: true           # /resume, codex resume / fork / archive
  worktree_isolation: false
  autonomy_slider: false
  ci_cd_integration: false
  multi_root: true               # --add-dir multi-project workspace
  agent_memory: true             # [features].memories（experimental 原生记忆）
  plugin_marketplace: true       # codex plugin marketplace（Git/本地源）
  context_management: true       # /compact + PreCompact/PostCompact 事件

permissions:
  # approval_policy 枚举；sandbox_mode（read-only|workspace-write|danger-full-access）是正交轴，勿混入本列表。
  modes: [untrusted, on-request, never]

model_routing:
  available_models: [gpt-5.6, gpt-5.6-terra, gpt-5.4, gpt-5.4-mini, gpt-5.3-codex-spark]
  # custom agent TOML 支持 per-agent model / model_reasoning_effort。
  per_agent_model: true
  user_resolved: false
  tier_map:
    light: gpt-5.6-terra
    standard: gpt-5.6
    heavy: gpt-5.6

context_injection:
  # Codex 逐级合并 AGENTS.md 链（project_doc_max_bytes 默认 32KiB 上限），无 @ 语法；
  # spawn_agent 子代理不继承主线程对话上下文，AGENT.md / dispatch-prompt 必须显式指示 Read。
  auto_injection:
    mechanism: agents_md
    eager: true
    size_limit_bytes: 32768
    preamble_files: []
  inline_file_syntax:
    kind: read_tool
    template: "请先 Read {path}"
  rules_distribution:
    target: .codex/rules
    format: markdown
    activation: manual_read
