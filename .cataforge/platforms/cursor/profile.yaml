platform_id: cursor
display_name: Cursor
version_tested: "3.1"

tool_map:
  file_read: {tool: Read, kind: native}
  file_write: {tool: Write, kind: native}
  file_edit: {tool: Write, kind: native}
  file_glob: {tool: Glob, kind: native}
  file_grep: {tool: Grep, kind: native}
  shell_exec: {tool: Shell, kind: native}
  web_search: {tool: WebSearch, kind: native}
  web_fetch: {tool: null, kind: unsupported}
  user_question: {tool: null, kind: unsupported}
  agent_dispatch: {tool: Task, kind: native}

extended_capabilities:
  notebook_edit: {tool: null, kind: unsupported}
  browser_preview: {tool: computer, kind: native}
  image_input: {tool: null, kind: unsupported}
  code_review: {tool: null, kind: unsupported}

agent_definition:
  format: yaml-frontmatter
  scan_dirs:
    # Only the first entry is ever written to during deploy; additional
    # entries are purely for read-time discovery. Keeping this Cursor-only
    # so a fresh Cursor deploy never produces .claude/* artifacts.
    - .cursor/agents
  needs_deploy: true

rules:
  # Optional Markdown mirror at .claude/rules — useful when the same repo is
  # also used with Claude Code and you want both IDEs to read the same
  # source-of-truth prompt files. Off by default so a pure Cursor project
  # keeps its tree clean of any .claude/ artifacts.
  cross_platform_mirror: false

skill_definition:
  # Cursor 3.x reads .claude/skills for skill discovery (shared convention).
  target_dir: .claude/skills
  needs_deploy: true

command_definition:
  # Cursor 3.x slash commands live under .cursor/commands/.
  target_dir: .cursor/commands
  needs_deploy: true

agent_config:
  tool_policy: allow_deny
  supported_fields:
    - name
    - description
    - tools
    - disallowedTools
    - model
    - maxTurns
    - mcpServers
    - hooks
    - background
  memory_scopes: []
  isolation_modes: [worktree]

instruction_file:
  reads_claude_md: false
  targets:
    - type: project_state_copy
      path: AGENTS.md
      # 三平台 (cursor/codex/opencode) 共享 AGENTS.md — section-merge +
      # always_overwrite_fields 保证每次 deploy 都让 '运行时:' 反映当前平台,
      # 同时不冲掉其他用户填的字段或用户新增的章节。
      update_strategy: section-merge
      section_policy:
        framework: [文档导航, 框架机制]
        schema:    [项目信息, 全局约定]
        runtime:   [项目状态, 执行环境]
        user_extensible: true
        always_overwrite_fields:
          项目信息: [运行时, 框架版本]
          全局约定: [设计工具]
  additional_outputs:
    - target: .cursor/rules/
      format: mdc
      source: rules + platform overrides

dispatch:
  tool_name: Task
  is_async: false
  params: [subagent_type, prompt, description, model]

hooks:
  config_format: json
  config_path: .cursor/hooks.json
  # Cursor hooks.json schema uses "type: command" for each hook entry.
  entry_type: command
  event_map:
    PreToolUse: preToolUse
    PostToolUse: postToolUse
    Stop: stop
    SessionStart: sessionStart
    Notification: null
  policies:
    guard_dangerous: {mode: native}
    guard_frozen_docs: {mode: native}
    log_agent_dispatch: {mode: native}
    validate_agent_result: {mode: native}
    lint_format: {mode: native}
    detect_correction:
      mode: degraded
      fallback:
        strategy: rules_injection
        coverage: partial
        reason: "平台缺少结构化用户提问工具"
        asset: overrides/rules/correction-record.md
    detect_review_flag: {mode: native}
    notify_done: {mode: native}
    notify_permission:
      mode: degraded
      fallback:
        strategy: skip
        coverage: none
        reason: "平台缺少 Notification 事件"
    session_context: {mode: native}
    deploy_drift: {mode: native}
    git_sync: {mode: native}

features:
  cloud_agents: true             # Cursor Cloud Agents in isolated VMs
  agent_teams: false
  parallel_agents: true          # up to 8 concurrent agents with worktrees
  scheduled_tasks: true          # Automations (event/schedule triggered)
  background_agents: true
  subagent_interactive: false    # dispatched/background agents run headless, no user-question channel
  plan_mode: false
  computer_use: true             # Cloud agent can start apps, click, screenshot, record
  realtime_voice: false
  multi_model: true              # OpenAI, Anthropic, Gemini, xAI, Cursor models
  session_resume: false
  worktree_isolation: true       # parallel agents use git worktrees
  autonomy_slider: true          # Tab → edit → full agentic mode
  ci_cd_integration: false
  multi_root: false
  agent_memory: false
  plugin_marketplace: true       # Team marketplace with access controls
  context_management: false

permissions:
  modes: [default, auto]

model_routing:
  available_models: [opus, sonnet, gpt-5.4, gemini-3-pro, grok-code, composer-2]
  per_agent_model: true
  user_resolved: false
  # Cursor's per-agent `model:` accepts the same Anthropic literals as
  # Claude Code; tier_map mirrors that. Users wanting GPT/Gemini per-agent
  # override at .cursor/agents/<name>.md after deploy.
  tier_map:
    light: sonnet
    standard: sonnet
    heavy: opus

context_injection:
  # Cursor 通过 .cursor/rules/*.mdc 实现规则注入；已使用 alwaysApply:true（见
  # CursorAdapter._wrap_as_mdc）。@-mention 在编辑器侧可用，但部署产物不依赖。
  auto_injection:
    mechanism: cursor_rules
    eager: true
    size_limit_bytes: null
    preamble_files: []
  inline_file_syntax:
    kind: at_mention
    template: "@{path}"
  rules_distribution:
    target: .cursor/rules
    format: mdc
    activation: always
