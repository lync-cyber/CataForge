# CataForge Hook 规范定义（平台无关）
# deploy 读取此文件 + 平台 profile 的 typed capability/hook policy 生成平台配置
#
# schema_version: 规范结构版本号（向前不兼容时递增）
#   v1 — 初始 hooks
#   v2 — 新增：matcher_file_pattern / matcher_command_pattern / matcher_agent_id
#        （可选；旧 hooks.yaml 省略时行为等同 v1）

schema_version: 2

hooks:
  PreToolUse:
    - matcher_capability: shell_exec
      script: guard_dangerous
      type: block
      description: "危险命令拦截"
      safety_critical: true
    - matcher_capability: file_edit
      script: guard_frozen_docs
      type: block
      description: "无人值守下冻结上游文档 (PRD/ARCH/UI-SPEC/DEV-PLAN) 写入拦截"
      safety_critical: true
    - matcher_capability: agent_dispatch
      script: log_agent_dispatch
      type: observe
      description: "子代理调度审计"

  PostToolUse:
    - matcher_capability: agent_dispatch
      script: validate_agent_result
      type: observe
      description: "子代理返回值验证"
    - matcher_capability: file_edit
      script: lint_format
      type: observe
      description: "文件编辑后自动格式化（observe 类但允许 in-place rewrite —— linter --fix / formatter --write 落盘）"
    - matcher_capability: user_question
      script: detect_correction
      type: observe
      description: "用户纠正信号捕获 (option-override)"
    - matcher_capability: agent_dispatch
      script: detect_review_flag
      type: observe
      description: "审查纠正信号捕获 (review-flag: reviewer 将 [ASSUMPTION] 判为 CRITICAL/HIGH)"
      matcher_agent_id: [reviewer]

  Stop:
    - script: notify_done
      type: observe
      description: "会话结束通知"

  Notification:
    - script: notify_permission
      type: observe
      description: "权限请求通知"

  SessionStart:
    - script: session_context
      type: observe
      description: "记录 session_start 事件（不部署、不改 tracked 文件）"
    - script: deploy_drift
      type: observe
      description: "检测 .cataforge 源/包版本漂移并提示 redeploy（不部署、不改 tracked 文件）"
    - script: git_sync
      type: observe
      description: "fetch + 快进干净的默认分支 + 清理 squash 合并的本地分支（不改 tracked 文件、永不切分支）"
