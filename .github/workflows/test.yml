name: Tests

# Three jobs run in parallel:
#
#   - `guards` single ubuntu + py3.12. All repo-content checks that are
#             independent of OS / Python version: ruff, pre-commit parity,
#             anti-rot guards, uv smokes, mypy, platform dry-runs, doctor,
#             framework-review. Runs ONCE — these read repo files, not
#             OS/version state, so the matrix must not duplicate them.
#   - `unit`  cross-platform / cross-Python pytest matrix (no slow marker).
#             Pure test execution — the only thing that actually varies by
#             OS and Python version. Any regression here blocks the PR.
#   - `e2e`   single ubuntu + py3.12 job that builds a wheel, spawns venvs
#             and exercises `cataforge setup` / `upgrade` via subprocess.
#             Linux-only — venv creation plus subprocess encoding on Windows
#             add flakiness without testing anything unit doesn't cover.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded PR runs; never cancel push-to-main validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guards:
    name: Lint + guards + meta-audit (ubuntu, py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so check_changelog_fragments.py can diff HEAD
          # against origin/main — a shallow clone hides the merge base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dev deps (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check src tests scripts

      - name: "pre-commit parity (catches local hooks ↔ CI drift)"
        # Runs the full .pre-commit-config.yaml hook set so a contributor
        # without `pre-commit install` can't ship a change that local hooks
        # would have caught. If this red-lights but Ruff above is green,
        # somebody changed .pre-commit-config.yaml in a way CI doesn't yet
        # mirror — fix the divergence rather than relaxing the hook.
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: "KG injection regression (P0–P3 named gate)"
        # Named step so a re-introduced SPARQL literal or IRI percent-encoding
        # bug surfaces with clear attribution. The unit matrix re-runs these
        # via the full suite; this gate just pins the attribution.
        run: python -m pytest tests/kg/test_sparql_escape.py tests/kg/test_injection_regression.py tests/kg/test_ingest_writer_atomicity.py tests/cli/test_cli_query.py -q

      - name: "Anti-rot guards (13: skill count, dev branch, changelog links, changelog fragments, doc versions, profile schema, hooks schema, schema-Python parity, marketing words, design residue, language coupling, doc structure, QueryBoolean-eq-True)"
        env:
          # check_changelog_fragments.py diffs HEAD against this base.
          # PR runs use the actual base branch; push-to-main runs default
          # to origin/main (script no-ops when no files differ).
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          python scripts/checks/check_skill_count.py
          python scripts/checks/check_no_dev_branch_refs.py
          python scripts/checks/check_changelog_link_table.py
          python scripts/checks/check_changelog_fragments.py
          python scripts/checks/check_doc_versions.py
          python scripts/checks/check_profile_yaml_keys.py
          python scripts/checks/check_hooks_yaml_schema.py
          python scripts/checks/check_schema_python_parity.py
          python scripts/checks/check_no_marketing_words.py
          python scripts/checks/check_no_design_residue.py
          python scripts/checks/check_no_language_coupling.py
          python scripts/checks/check_doc_structure.py
          python scripts/checks/check_no_query_boolean_eq_true.py

      - name: "uv lockfile freshness (uv.lock ↔ pyproject.toml in sync)"
        # Catches "edited deps but forgot to refresh uv.lock" before it
        # silently rots downstream uv-based installs.
        run: uv lock --check

      - name: "uv smoke — default-extras pytest collection (catches runtime-dep gaps)"
        # `pip install -e ".[dev]"` above hides runtime/dev dep mix-ups: if a
        # runtime module imports a [dev]-only transitive, the dev-extras
        # install masks it and downstream users hit ImportError on first run.
        # Build with default extras only and collect to surface the gap.
        run: |
          uv venv .venv-smoke
          uv pip install --python .venv-smoke -e . pytest
          uv run --python .venv-smoke pytest --collect-only -q

      - name: "uv run --extra dev pytest smoke (covers the uv code path)"
        # A representative subset via uv so a uv-only regression (resolver
        # edge case, lockfile-induced pin, .venv layout drift) surfaces. The
        # pip-editable matrix gates correctness; this only exercises the uv
        # resolve+run path — tests/cli + tests/core touch the broadest import
        # surface to do that.
        run: uv run --extra dev pytest tests/cli tests/core -q -m "not slow" -n auto --dist loadscope

      - name: "mypy (informational — strict-clean packages gate; rest reports count)"
        # Full repo: informational (prints count, does not fail).
        # Strict-clean packages (cataforge.application.services.*) MUST be
        # zero-error. New strict-opt-in packages add rows here.
        run: |
          set -eu
          echo "::group::Full-repo mypy (informational)"
          python -m mypy src/cataforge --no-incremental || true
          echo "::endgroup::"
          echo "::group::Strict packages (must be clean)"
          python -m mypy --strict --no-incremental src/cataforge/application/services
          echo "::endgroup::"

      - name: "platform dry-run snapshots (cursor / codex / opencode)"
        # Exercises each adapter's `deploy --dry-run` code path so a refactor
        # that breaks one surfaces without the real IDE installed.
        # `--project-dir` is a global flag (lives before the subcommand).
        run: |
          set -eu
          tmpdir=$(mktemp -d)
          cataforge --project-dir "$tmpdir" setup --platform claude-code
          for plat in cursor codex opencode; do
            echo "::group::deploy --dry-run --platform $plat"
            cataforge --project-dir "$tmpdir" deploy \
              --platform "$plat" --dry-run
            echo "::endgroup::"
          done

      - name: "cataforge doctor (gates _DEPRECATED_REFS, runtime_api_version, orphan docs, …)"
        run: cataforge doctor

      - name: "framework-review (B1/B2/B3/B4/B5 meta-asset audit)"
        # Catches rot classes doctor can't see: AGENT.md / SKILL.md missing
        # required sections, broken cross-refs in skills:/depends:, SKILL.md
        # ↔ CHECKS_MANIFEST drift, hard-coded constant literals, phase ×
        # agent × skill coverage gaps.
        run: cataforge skill run framework-review -- all

  unit:
    name: Unit (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu covers both the oldest and newest supported Python;
        # windows covers only the newest — the windows × oldest-Python
        # combination historically surfaced nothing the other legs miss.
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev deps (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Pytest (fast — exclude slow marker)
        # `-n auto` parallelizes across cores; `--dist loadscope` keeps a
        # module's/class's tests on one worker so cwd-mutating
        # (monkeypatch.chdir) and socket-binding tests never interleave
        # across processes.
        run: python -m pytest tests/ -q -m "not slow" -n auto --dist loadscope

  e2e:
    name: E2E install + upgrade (ubuntu, py3.12)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build + dev deps
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Pytest (e2e — slow marker only, network gated)
        env:
          # Enable the PyPI-fetching cross-version test. If PyPI is
          # transiently unavailable the job red-lights — acceptable because
          # a release-chain problem *should* surface loudly.
          CATAFORGE_E2E_NETWORK: "1"
        run: python -m pytest tests/e2e/ -q -m slow
