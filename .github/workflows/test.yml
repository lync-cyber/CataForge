name: Tests

# Three jobs run in parallel:
#
#   - `guards` single ubuntu + py3.12. Repo-wide static gates run once
#             through scripts/checks/run_local.py, the local/CI SSOT.
#             PR-context changelog diffing, workflow YAML parsing, uv install
#             smokes, platform dry-runs, doctor and framework audits stay
#             separate because they need distinct context or attribution.
#   - `unit`  cross-platform / cross-Python pytest matrix (no slow marker).
#             Pure test execution - the only thing that actually varies by
#             OS and Python version. Any regression here blocks the PR. One
#             designated leg additionally measures coverage (gate >= 75%), so
#             the threshold is a single deterministic run folded into the
#             matrix rather than a separate full-suite execution.
#   - `e2e`   single ubuntu + py3.12 job that builds a wheel, spawns venvs
#             and exercises `cataforge setup` / `upgrade` via subprocess.
#             Linux-only - venv creation plus subprocess encoding on Windows
#             add flakiness without testing anything unit does not cover.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded PR runs; never cancel push-to-main validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI has no use for the local pre-commit hook (the guards job runs the same
# repo-wide static checks through scripts/checks/run_local.py). Opt out so
# conftest's auto-install never runs - it would otherwise print a banner into
# pytest output on every fresh runner.
#
# PYTHONUTF8=1 puts every job in Python UTF-8 Mode, matching how the CLI runs
# in production (ensure_utf8 re-execs under it). Internal code reads/writes
# files without an explicit encoding= and relies on that default; on the
# Windows runner the ANSI code page would otherwise make bare file I/O cp1252.
env:
  CATAFORGE_SKIP_HOOK_AUTOINSTALL: "1"
  PYTHONUTF8: "1"

jobs:
  guards:
    name: Lint + guards + meta-audit (ubuntu, py3.12)
    runs-on: ubuntu-latest
    # Ceiling so a hung step (network stall in an audit, deadlocked
    # subprocess) fails in minutes instead of burning the 6h default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so check_changelog_fragments.py can diff HEAD
          # against origin/main — a shallow clone hides the merge base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          # Key the pip cache on the dep source so it invalidates when deps
          # change and hits otherwise (bare `cache: pip` finds no lockfile here).
          cache-dependency-path: pyproject.toml

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dev deps (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: "Static gates (run_local SSOT)"
        # One repo-wide static gate owns ruff, format, mypy --no-incremental,
        # import-linter, uv lock freshness, codegen freshness, and the
        # deterministic anti-rot checks. Keep those checks in run_local.py so
        # local and CI static validation cannot drift or run the same scan twice.
        run: python scripts/checks/run_local.py

      - name: "PR-context changelog fragments"
        # This guard diffs HEAD against BASE_REF, so it legitimately stays
        # outside run_local.py, which must also work outside pull requests.
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: python scripts/checks/check_changelog_fragments.py

      - name: "Workflow YAML parse"
        # Keep the fast workflow parser as a direct CI step; it is file-arg
        # shaped in pre-commit and GitHub can otherwise reject a workflow before
        # useful logs are available.
        run: python -c "import sys, yaml; [yaml.safe_load(open(f, encoding='utf-8').read()) for f in sys.argv[1:]]" .github/workflows/*.yml

      - name: "uv smoke - default-extras pytest collection"
        # `pip install -e ".[dev]"` above hides runtime/dev dep mix-ups: if a
        # runtime module imports a [dev]-only transitive, the dev-extras
        # install masks it and downstream users hit ImportError on first run.
        # Build with default extras only and collect to surface the gap.
        run: |
          uv venv .venv-smoke
          uv pip install --python .venv-smoke -e . pytest
          uv run --python .venv-smoke pytest --collect-only -q

      - name: "uv run --extra dev smoke"
        # Exercise the uv resolve+run path without duplicating the full unit
        # matrix. The matrix gates correctness; this step only needs enough
        # CLI/core coverage to prove the locked dev environment can execute.
        run: uv run --extra dev pytest tests/cli/test_cli_smoke.py tests/core/test_config.py -q -m "not slow"

      - name: "Duplication scan (jscpd ≤1% of src)"
        # Language-agnostic copy-paste gate. Reads .jscpd.json (threshold: 1);
        # non-zero exit when src duplication exceeds the ceiling.
        run: npx --yes jscpd@4 src

      - name: "platform dry-run snapshots (cursor / codex / opencode)"
        # Exercises each adapter's `deploy --dry-run` code path so a refactor
        # that breaks one surfaces without the real IDE installed.
        # `--project-dir` is a global flag (lives before the subcommand).
        run: |
          set -eu
          tmpdir=$(mktemp -d)
          cataforge --project-dir "$tmpdir" setup --platform claude-code
          for plat in cursor codex opencode; do
            echo "::group::deploy --dry-run --platform $plat"
            cataforge --project-dir "$tmpdir" deploy \
              --platform "$plat" --dry-run
            echo "::endgroup::"
          done

      - name: "cataforge doctor (gates _DEPRECATED_REFS, runtime_api_version, orphan docs, …)"
        run: cataforge doctor

      - name: "framework-review (B1/B2/B3/B4/B5 meta-asset audit)"
        # Catches rot classes doctor can't see: AGENT.md / SKILL.md missing
        # required sections, broken cross-refs in skills:/depends:, SKILL.md
        # ↔ CHECKS_MANIFEST drift, hard-coded constant literals, phase ×
        # agent × skill coverage gaps.
        run: cataforge skill run framework-review -- all

      - name: "platform-audit offline (profile conformance + consistency + schema)"
        # Static no-network subset of platform-audit. FAIL-level findings
        # (unloadable profile, missing required capability, schema-required key
        # absent) block; the accepted-degradation consistency WARNs print but
        # do not fail. version_tested staleness is the weekly anti-rot guard.
        run: cataforge skill run platform-audit -- --offline

  unit:
    name: Unit (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # ubuntu covers the newest supported Python (coverage rides this leg);
        # windows covers the same newest Python — the cross-OS delta is where
        # regressions surface, not the Python minor.
        include:
          # Coverage rides this leg (newest ubuntu Python) — a single
          # deterministic measurement; fail_under (≥75%) lives in
          # [tool.coverage.report].
          - os: ubuntu-latest
            python-version: "3.13"
            coverage: true
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev deps (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Pytest (fast — exclude slow marker)
        # `-n auto` parallelizes across cores; `--dist loadscope` keeps a
        # module's/class's tests on one worker so cwd-mutating
        # (monkeypatch.chdir) and socket-binding tests never interleave
        # across processes. The coverage leg adds --cov so the ≥75% gate is a
        # single deterministic run; other legs skip it (coverage is OS/Python
        # independent for line reporting).
        run: >-
          python -m pytest tests/ -q -m "not slow" -n auto --dist loadscope
          ${{ matrix.coverage && '--cov=cataforge --cov-report=term-missing:skip-covered' || '' }}

  e2e:
    name: E2E install + upgrade (ubuntu, py3.12)
    runs-on: ubuntu-latest
    continue-on-error: false
    # Higher ceiling: builds a wheel, spawns venvs, and reaches PyPI over the
    # network — a transient PyPI hang should fail loud, not run for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build + dev deps
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Pytest (e2e — slow marker only, network gated)
        env:
          # Enable the PyPI-fetching cross-version test. If PyPI is
          # transiently unavailable the job red-lights — acceptable because
          # a release-chain problem *should* surface loudly.
          CATAFORGE_E2E_NETWORK: "1"
          # Raise the per-test timeout above the conftest default (300s): a
          # cold session wheel-build plus the cross-version PyPI install can
          # share one test's window. conftest defers to this env value.
          PYTEST_TIMEOUT: "600"
        run: python -m pytest tests/e2e/ -q -m slow
