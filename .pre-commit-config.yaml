## CataForge pre-commit hooks
##
## Install once per clone:    pip install pre-commit && pre-commit install
## Run on demand:              pre-commit run --all-files
##
## Local-only (no network on commit). The same checks run in CI as a
## belt-and-braces guard — these hooks just shorten the feedback loop.

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: python -m ruff check src tests scripts
        language: system
        pass_filenames: false
        types_or: [python]
      - id: stdio-utf8-guard
        name: scripts/*.py call ensure_utf8_stdio() (Windows cp1252 guard)
        description: |
          Mirrors tests/test_scripts_stdio_guard.py at commit time. Any
          new script that prints non-ASCII (→/中文/emoji) to stdout will
          crash on Windows cp1252 unless it reconfigures stdio to UTF-8;
          catch the omission locally instead of waiting for CI.
        entry: python -m pytest tests/test_scripts_stdio_guard.py -q
        language: system
        pass_filenames: false
        files: ^scripts/.*\.py$
      - id: schema-python-parity
        name: schemas/*.schema.json vs Python mirror parity
        description: |
          The two formal JSON Schema files have hand-rolled Python mirrors
          (cataforge.core.event_log + validate_agent_result hook). When one
          edge of the pair drifts, validation diverges silently. This check
          locks them.
        entry: python scripts/checks/check_schema_python_parity.py
        language: system
        pass_filenames: false
        files: ^(\.cataforge/schemas/.*\.schema\.json|src/cataforge/core/event_log\.py|src/cataforge/hook/scripts/validate_agent_result\.py)$
      - id: workflow-yaml-parse
        name: github workflows parse cleanly
        description: |
          Catches step-name colons / indentation issues that make GitHub
          Actions reject the workflow file (manifests as "This run likely
          failed because of a workflow file issue" with no logs). Was a
          silent CI red streak on main; see PR #75.
        entry: python -c "import sys, yaml; [yaml.safe_load(open(f, encoding='utf-8').read()) for f in sys.argv[1:]]"
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: no-marketing-words
        name: no marketing adverbs in user-facing docs
        description: |
          User docs ban vague adverbs (一键 / 智能 / 只需 / 最简单 / 轻松,
          simply / just / obviously / easily) — they convey no information
          to a stuck reader and add a sales-deck tone. Mirrors the CI guard.
        entry: python scripts/checks/check_no_marketing_words.py
        language: system
        pass_filenames: false
        files: ^(README\.md|docs/.*\.md|\.cataforge/(skills|agents)/.*\.md)$
      - id: no-design-residue
        name: no design-phase residue in runtime agent/skill assets
        description: |
          .cataforge/agents/**/AGENT.md and .cataforge/skills/**/SKILL.md
          are loaded into the LLM context at runtime. Block design-phase
          comments (<!-- 变更原因 -->, <!-- diagnostic # -->) plus inline
          narrative residue (issue #N citations, PR #N citations, version
          milestones like `v0.1.10 起`, `pre-v0.4.0`, `landed in …`).
        entry: python scripts/checks/check_no_design_residue.py
        language: system
        pass_filenames: false
        files: ^\.cataforge/(agents|skills|rules)/.*\.md$
      - id: no-language-coupling
        name: agent / skill body language-agnostic
        description: |
          .cataforge/agents/**/AGENT.md and .cataforge/skills/**/SKILL.md
          subjects are responsibilities, not languages. Block leaks of
          language-specific business keywords (FastAPI lifespan,
          Spring @Autowired, Redux dispatch, …) into the prompt body —
          they belong in docs/reference/ where they don't bloat every
          dispatch. Tool-adapter clauses (ESLint / Ruff / golangci-lint)
          are deliberately not flagged. See CLAUDE.md §Agent / Skill 撰写约定.
        entry: python scripts/checks/check_no_language_coupling.py
        language: system
        pass_filenames: false
        files: ^\.cataforge/(agents|skills)/.*\.md$
      # kg-* hooks invoke the cataforge CLI itself, so they MUST run under
      # an interpreter that has cataforge importable — not necessarily the
      # system `python` (most contributor machines don't have cataforge
      # there). The wrapper probes for one in priority order: active
      # $VIRTUAL_ENV → repo .venv → uv → sys.executable. Works whether the
      # contributor uses uv, plain pip-venv, or a CI editable install.
      - id: kg-template-lint
        name: kg render templates (Jinja2 + SPARQL static checks)
        description: |
          Render templates under .cataforge/skills/doc-gen/templates/**.md.j2
          must parse cleanly, contain ORDER BY in every embedded SPARQL
          query, and avoid deprecated v0.4 placeholders ({project} / {ver}).
          Drift surfaces as silent render churn (R-03 / R-07).
        entry: python scripts/precommit/run_cataforge.py kg template-lint --project-root .
        language: system
        pass_filenames: false
        files: ^\.cataforge/skills/.*templates/.*\.md\.j2$
      - id: kg-render-check
        name: kg render --check (idempotency of rendered markdown)
        description: |
          Every .md.j2 template must render byte-identically to its
          current docs/ output. PostToolUse auto-ingest depends on this:
          without it, every edit produces phantom triples and the merge
          accumulates conflicts (design §4.3 / R-03).
        entry: python scripts/precommit/run_cataforge.py kg render --project-root . --check
        language: system
        pass_filenames: false
        files: ^(\.cataforge/skills/.*templates/.*\.md\.j2|docs/.*\.md|docs/\.doc-graph/.*\.nq)$
      - id: kg-validate
        name: kg validate (SHACL conformance gate)
        description: |
          Project ontology + L0/L1/L2 + L3 SHACL shapes must validate.
          Conformance is a release gate; tighten incrementally by adding
          shapes rather than disabling this hook.
        entry: python scripts/precommit/run_cataforge.py kg validate --project-root .
        language: system
        pass_filenames: false
        files: ^docs/\.doc-graph/.*\.nq$
      - id: doc-structure
        name: document structure hygiene (step numbering)
        description: |
          .cataforge/{agents,skills,rules}/**/*.md are loaded into the LLM
          context at runtime. Non-standard step numbering (3a., 4b.),
          gaps in numbered sequences, and duplicate step numbers cause
          silent ambiguity in agent execution and rot over time. Use
          sequential integers only; merge sub-steps inline or as nested
          bullets.
        entry: python scripts/checks/check_doc_structure.py
        language: system
        pass_filenames: false
        files: ^\.cataforge/(agents|skills|rules)/.*\.md$
