## CataForge pre-commit hooks
##
## Install once per clone:    pip install pre-commit && pre-commit install
## Run on demand:              pre-commit run --all-files
##
## Local-only (no network on commit). The same checks run in CI as a
## belt-and-braces guard — these hooks just shorten the feedback loop.

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: python -m ruff check src tests scripts
        language: system
        pass_filenames: false
        types_or: [python]
      - id: ruff-format
        name: ruff format (check)
        entry: python -m ruff format --check src tests scripts
        language: system
        pass_filenames: false
        types_or: [python]
      - id: mypy
        name: mypy (strict, src/cataforge)
        description: |
          Shift the [tool.mypy] strict gate left to commit time. Runs
          incrementally (no --no-incremental) so the local loop stays fast;
          CI re-runs it with --no-incremental as the authoritative gate.
          Runs through `uv run --extra dev` so the dev venv (with type stubs
          such as types-PyYAML) is used regardless of which Python is on PATH
          at commit time — a bare `python -m mypy` would miss the stubs and
          report spurious import-untyped errors.
        entry: uv run --extra dev mypy src/cataforge
        language: system
        pass_filenames: false
        types_or: [python]
        files: ^src/cataforge/.*\.py$
      - id: stdio-utf8-guard
        name: scripts/*.py call ensure_utf8() (Windows cp1252 guard)
        description: |
          Mirrors tests/test_scripts_stdio_guard.py at commit time. Any
          new script that prints non-ASCII (→/中文/emoji) to stdout will
          crash on Windows cp1252 unless it reconfigures stdio to UTF-8;
          catch the omission locally instead of waiting for CI.
        entry: python -m pytest tests/test_scripts_stdio_guard.py -q
        language: system
        pass_filenames: false
        files: ^scripts/.*\.py$
      - id: schema-python-parity
        name: schemas/*.schema.json vs Python mirror parity
        description: |
          The two formal JSON Schema files have hand-rolled Python mirrors
          (cataforge.core.event_log + validate_agent_result hook). When one
          edge of the pair drifts, validation diverges silently. This check
          locks them.
        entry: python scripts/checks/check_schema_python_parity.py
        language: system
        pass_filenames: false
        files: ^(\.cataforge/schemas/.*\.schema\.json|src/cataforge/core/event_log\.py|src/cataforge/runtime/hook/scripts/validate_agent_result\.py)$
      - id: kg-codegen-fresh
        name: kg _generated/ in sync with LinkML schemas
        description: |
          src/cataforge/domain/kg/_generated/{core,governance}_pydantic.py and
          subclass_axioms.ttl are checked-in codegen output. Editing a schema
          under src/cataforge/domain/kg/schemas/ without rerunning
          scripts/codegen_kg_schema.py leaves them stale; this regenerates into
          a temp dir and byte-compares. The nondeterministic SHACL shapes
          (*_shapes.ttl) are excluded and stay gitignored.
        entry: python scripts/checks/check_codegen_fresh.py
        language: system
        pass_filenames: false
        files: ^(src/cataforge/domain/kg/(schemas/.*\.yaml|_generated/.*\.(py|ttl))|scripts/codegen_kg_schema\.py)$
      - id: workflow-yaml-parse
        name: github workflows parse cleanly
        description: |
          Catches step-name colons / indentation issues that make GitHub
          Actions reject the workflow file (manifests as "This run likely
          failed because of a workflow file issue" with no logs). Was a
          silent CI red streak on main; see PR #75.
        entry: python -c "import sys, yaml; [yaml.safe_load(open(f, encoding='utf-8').read()) for f in sys.argv[1:]]"
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: no-design-residue
        name: no design-phase residue in runtime agent/skill assets
        description: |
          .cataforge/agents/**/AGENT.md and .cataforge/skills/**/SKILL.md
          are loaded into the LLM context at runtime. Block design-phase
          comments (<!-- 变更原因 -->, <!-- diagnostic # -->) plus inline
          narrative residue (issue #N citations, PR #N citations, version
          milestones like `v0.1.10 起`, `pre-v0.4.0`, `landed in …`).
        entry: python scripts/checks/check_no_design_residue.py
        language: system
        pass_filenames: false
        files: ^\.cataforge/(agents|skills|rules)/.*\.md$
      - id: no-language-coupling
        name: agent / skill body language-agnostic
        description: |
          .cataforge/agents/**/AGENT.md and .cataforge/skills/**/SKILL.md
          subjects are responsibilities, not languages. Block leaks of
          language-specific business keywords (FastAPI lifespan,
          Spring @Autowired, Redux dispatch, …) into the prompt body —
          they belong in docs/reference/ where they don't bloat every
          dispatch. Tool-adapter clauses (ESLint / Ruff / golangci-lint)
          are deliberately not flagged. See CLAUDE.md §Agent / Skill 撰写约定.
        entry: python scripts/checks/check_no_language_coupling.py
        language: system
        pass_filenames: false
        files: ^\.cataforge/(agents|skills)/.*\.md$
      - id: doc-structure
        name: document structure hygiene (step numbering)
        description: |
          .cataforge/{agents,skills,rules}/**/*.md are loaded into the LLM
          context at runtime. Non-standard step numbering (3a., 4b.),
          gaps in numbered sequences, and duplicate step numbers cause
          silent ambiguity in agent execution and rot over time. Use
          sequential integers only; merge sub-steps inline or as nested
          bullets.
        entry: python scripts/checks/check_doc_structure.py
        language: system
        pass_filenames: false
        files: ^\.cataforge/(agents|skills|rules)/.*\.md$
      - id: prompt-cli-drift
        name: prompt assets reference real CLI verbs
        description: |
          .cataforge/{agents,skills,rules}/**/*.md invoke
          `cataforge context|docs|kg <verb>`. A reference to a verb the CLI
          does not register (a phantom command) silently breaks the workflow
          at runtime. The guard introspects the real Click groups and fails
          on any command-styled reference to an unknown verb.
        entry: python scripts/checks/check_prompt_cli_drift.py
        language: system
        pass_filenames: false
        files: ^\.cataforge/(agents|skills|rules)/.*\.md$
      - id: layer-dependencies
        name: layered dependency direction (interface→…→core→utils)
        description: |
          Enforce the layered dependency direction inside src/cataforge:
          interface → application → {runtime, domain} → adapter → core →
          utils. A module-level (static) import from a lower layer up to a
          higher one inverts the graph / creates an import cycle. Lazy
          function-local imports are the sanctioned escape valve; annotate a
          deliberate static edge with `# allow-layer-dep: <reason>`.
        entry: python scripts/checks/check_layer_dependencies.py
        language: system
        pass_filenames: false
        files: ^src/cataforge/.*\.py$
      - id: no-query-boolean-eq-true
        name: no QueryBoolean == True antipattern under cataforge.domain.kg
        description: |
          pyoxigraph 0.5.x returns QueryBoolean from Store.query() for ASK;
          `QueryBoolean == True` silently always evaluates False. Every
          ASK consumer in the KG layer must route through
          cataforge.domain.kg._ask.ask(store, sparql) -> bool. Spike-2 §2.2,
          issue #142. Mirrors the CI guard in test.yml.
        entry: python scripts/checks/check_no_query_boolean_eq_true.py
        language: system
        pass_filenames: false
        files: ^src/cataforge/domain/kg/.*\.py$
      - id: echo-err-for-errors
        name: cli/ error-toned echoes must use err=True (route to stderr)
        description: |
          src/cataforge/interface/cli/ click.echo / click.secho calls whose first
          arg starts with Error: / ERROR: / Cannot / Could not /
          Refused / Invalid / Failed / FAIL: must pass err=True so
          scripts piping success output (`cataforge … | jq`) do not
          lose the message into stdout. Per-call exemption:
          `# allow-stdout-echo: <reason>` inline. cli/doctor/ is
          exempt — it is structured stdout by design.
        entry: python scripts/checks/check_echo_err_for_errors.py
        language: system
        pass_filenames: false
        files: ^src/cataforge/interface/cli/.*\.py$
      - id: no-raw-subprocess
        name: no raw subprocess.run outside the wrapper
        description: |
          Every src/cataforge/ subprocess.run / Popen / call must go
          through cataforge.utils.run_subprocess.run, which centralises
          timeout / text mode / encoding / check=False policy. Sites
          the wrapper deliberately doesn't cover (Popen for long-running
          processes, shell=True with **proc_kwargs passthrough) carry
          an inline `# allow-raw-subprocess: <reason>` exemption.
        entry: python scripts/checks/check_no_raw_subprocess.py
        language: system
        pass_filenames: false
        files: ^src/cataforge/.*\.py$
      - id: no-redundant-encoding
        name: no redundant encoding="utf-8" on file I/O
        description: |
          The process runs in Python UTF-8 Mode end to end (ensure_utf8
          re-execs under PYTHONUTF8=1; the test session does the same), so
          open / read_text / write_text already default to UTF-8. An explicit
          encoding="utf-8" on those calls under src/cataforge/ is redundant —
          drop it, or carry an inline `# allow-explicit-encoding: <reason>`.
          The boundary layer that defines the contract is exempt.
        entry: python scripts/checks/check_no_redundant_encoding.py
        language: system
        pass_filenames: false
        files: ^src/cataforge/.*\.py$
      - id: kg-injection-regression
        name: KG SPARQL/IRI injection regression
        description: |
          Whenever the escape utilities, ASK chokepoint, or the typed
          write surfaces (writer / transaction) change, run the
          dedicated escape unit tests and the end-to-end injection
          regression to catch a re-introduction of the percent-encoding
          or literal-escape bugs the centralised helpers were created
          to close. Mirrors the named CI step in test.yml.
        entry: python -m pytest tests/kg/test_sparql_escape.py tests/kg/test_injection_regression.py -q
        language: system
        pass_filenames: false
        files: ^src/cataforge/domain/kg/(_sparql_utils|_ask|transaction|ingest/writer|ingest/verify)\.py$
