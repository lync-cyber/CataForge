[project]
name = "cataforge"
dynamic = ["version"]
description = "AI Programming: Agent + Skill Workflow Framework — one .cataforge/ spec, many IDEs (Claude Code, Cursor, Codex, OpenCode)."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "huancheng.lin", email = "huancheng.lin@foxmail.com" },
]
maintainers = [
    { name = "huancheng.lin", email = "huancheng.lin@foxmail.com" },
]
keywords = [
    "ai",
    "agent",
    "skill",
    "workflow",
    "claude-code",
    "cursor",
    "codex",
    "opencode",
    "mcp",
    "tdd",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "pydantic>=2.0",
    "markdown-it-py>=3.0",
    "linkml-runtime>=1.11.1",
    "pyoxigraph>=0.5.8",
    "jinja2>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "build>=1.2",
    "twine>=5.0",
    "scriv[toml]>=1.5",
    "linkml>=1.11.1",
    "import-linter>=2.0",
    # `.pre-commit-config.yaml` ships a ruff hook + other static checks;
    # they only fire if `pre-commit` itself is installed and `pre-commit
    # install` has been run once per clone. Bundling here means
    # `pip install -e .[dev]` + `pre-commit install` is the canonical
    # one-time setup.
    "pre-commit>=3.5",
]
mcp = ["mcp>=1.0"]
docker = ["docker>=7.0"]
penpot = ["docker>=7.0"]
kg = []
shacl = [
    "pyshacl>=0.27",
    "rdflib>=7.0",
]
all = ["docker>=7.0", "mcp>=1.0", "pyshacl>=0.27", "rdflib>=7.0"]

[project.urls]
Homepage = "https://github.com/lync-cyber/CataForge"
Repository = "https://github.com/lync-cyber/CataForge"
Issues = "https://github.com/lync-cyber/CataForge/issues"
Documentation = "https://github.com/lync-cyber/CataForge/tree/main/docs"
Changelog = "https://github.com/lync-cyber/CataForge/releases"

[project.scripts]
cataforge = "cataforge.interface.cli.main:cli"

[project.entry-points."cataforge.platforms"]
claude-code = "cataforge.adapter.platform.claude_code:ClaudeCodeAdapter"
cursor = "cataforge.adapter.platform.cursor:CursorAdapter"
codex = "cataforge.adapter.platform.codex:CodexAdapter"
opencode = "cataforge.adapter.platform.opencode:OpenCodeAdapter"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/cataforge/__init__.py"

[tool.hatch.build.targets.wheel]
# Ships everything under src/cataforge plus the canonical `.cataforge/`
# scaffold (agents / skills / rules / hooks / platform profiles / schemas
# / templates) packaged via force-include below — single source of truth,
# no maintained mirror.
packages = ["src/cataforge"]

[tool.hatch.build.targets.wheel.force-include]
# Pack repo-root `.cataforge/` into the wheel as cataforge/_dot_cataforge/
# so the runtime can resolve it via `importlib.resources.files("cataforge")`
# .joinpath("_dot_cataforge"). Replaces the previous "sync to
# src/cataforge/_assets/cataforge_scaffold/" mirror approach (PR #84).
".cataforge" = "cataforge/_dot_cataforge"

[tool.hatch.build.targets.editable.force-include]
# Editable installs (`pip install -e .`) need the same mapping so
# `cataforge setup` etc. can resolve the scaffold without a wheel build.
".cataforge" = "cataforge/_dot_cataforge"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/scripts",
    "/.cataforge",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    # LinkML codegen output — regenerated by `scripts/codegen_kg_schema.py`,
    # gitignored, and not maintained by hand. Long lines + style choices
    # come from the codegen template, not the author.
    "src/cataforge/domain/kg/_generated",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C901"]

[tool.ruff.lint.mccabe]
# Cyclomatic-complexity ceiling. Functions above this fail the lint gate.
max-complexity = 15

[tool.pyright]
# Mypy is the primary type checker (see `[tool.mypy]` per-package
# strict overrides). Pyright runs in IDE / editor only as a syntax
# + unused-symbol layer; `basic` mode produces 170+ false positives
# against pyoxigraph / linkml / docker (no stubs, dynamic APIs)
# which drown real signal. `typeCheckingMode = "off"` disables type
# inference reporting; the explicit `report*` overrides below pin
# the surface to what we actually want:
#
#   - real dead-import / dead-expression detection (warning)
#   - silence "unused-variable" hints for underscore-prefix &
#     decorator-injected params (ruff F841 with proper underscore
#     semantics is the source of truth)
#   - silence missing-stubs noise for runtime-only deps
include = ["src", "tests", "scripts"]
exclude = [
    "**/__pycache__",
    "**/_generated/**",
    "**/.venv/**",
    ".cataforge/**",
    "build/**",
    "dist/**",
]
pythonVersion = "3.11"
typeCheckingMode = "off"

reportUnusedVariable = "none"
reportUnusedFunction = "none"
reportUnusedClass = "none"
reportUnusedImport = "warning"
reportUnusedExpression = "warning"
reportPrivateUsage = "none"
reportPrivateImportUsage = "none"
reportMissingTypeStubs = "none"
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: end-to-end tests that build a wheel, spawn a venv, or hit PyPI — opt out with `pytest -m 'not slow'`",
    "network: tests that reach external services (e.g. PyPI); gated by CATAFORGE_E2E_NETWORK=1",
]
filterwarnings = [
    # `requests` (a transitive dep of the linkml stack — cataforge never
    # imports it directly) emits this at import time when the resolved
    # urllib3 / charset_normalizer are newer than the requests release
    # knows about. Not actionable in our code. Matched by message, not
    # category, so the filter resolves even where requests isn't installed
    # (e.g. the default-extras uv collection smoke).
    "ignore:urllib3 .*doesn't match a supported version:Warning",
]

[tool.coverage.run]
source = ["cataforge"]
omit = [
    "src/cataforge/domain/kg/_generated/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
# Policy: opt-in strict per-package, not blanket strict. The historic
# `strict = true` setting produced a ~200-error baseline that no CI gate
# could enforce without first burning that backlog. Now the global stays
# minimal (just type checking + cache hygiene); modules opt into strict
# via [[tool.mypy.overrides]] as they get cleaned up. See
# `docs/contributing.md` § Type checking for the convergence workflow.
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Per-package strict overrides — add modules here as they reach zero
# errors under strict. New code should be authored strict-ready when the
# surrounding package is already opted in. Workflow: pick a module, run
# `uv run --extra dev mypy --strict src/cataforge/<pkg>`, fix what you
# can, add a type: ignore (with a specific code) only as last resort,
# then add the dotted-name pattern here.
[[tool.mypy.overrides]]
module = [
    "cataforge.application.services.*",
    "cataforge.application.feedback",
    "cataforge.application.feedback.*",
]
strict = true

[[tool.mypy.overrides]]
# LinkML codegen output: regenerated by scripts/codegen_kg_schema.py, gitignored,
# and excluded from ruff above. Hand-added annotations would be wiped on regen,
# so errors here are silenced wholesale rather than counted against strict.
module = ["cataforge.domain.kg._generated.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# Third-party runtime deps that ship no type stubs or py.typed marker.
module = ["pyshacl.*", "linkml_runtime.*", "docker.*"]
ignore_missing_imports = true

[tool.scriv]
# Markdown-native changelog fragments — see changelog.d/README.md for
# the per-PR workflow. Aggregated into CHANGELOG.md at release time via
# `scriv collect --version=X.Y.Z`.
format = "md"
fragment_directory = "changelog.d"
new_fragment_template = "file:changelog.d/.template.md.j2"
md_header_level = "2"
categories = [
    "Added",
    "Changed",
    "Fixed",
    "Removed",
    "Deprecated",
    "Security",
]
entry_title_template = "[{{ version }}] — {{ date.strftime('%Y-%m-%d') }}"
# scriv inserts new entries at the `<!-- scriv-insert-here -->` marker
# in CHANGELOG.md (placed right after the file's intro block).
insert_marker = "<!-- scriv-insert-here -->"

[tool.importlinter]
root_packages = ["cataforge"]

[[tool.importlinter.contracts]]
name = "Layered architecture: interface → application → {runtime,domain} → adapter → core → utils"
type = "layers"
layers = [
    "cataforge.interface",
    "cataforge.application",
    "cataforge.runtime | cataforge.domain",
    "cataforge.adapter",
    "cataforge.core",
    "cataforge.utils",
]
ignore_imports = [
    # adapter TYPE_CHECKING-only upward import of runtime type (mirrored in UPWARD_IMPORT_ALLOWLIST)
    "cataforge.adapter.platform.cursor -> cataforge.runtime.deploy.manifest",
    "cataforge.adapter.platform.opencode -> cataforge.runtime.deploy.manifest",
    # runtime builtin lazy-imports application layer to avoid module-level cycle
    "cataforge.runtime.skill.builtins.framework_feedback.framework_feedback -> cataforge.application.feedback",
    # interface layer doctor commands lazy-import runtime/domain (function-body imports)
    "cataforge.interface.cli.doctor.deploy_integrity -> cataforge.runtime.deploy.manifest",
    "cataforge.interface.cli.doctor.deploy_integrity -> cataforge.runtime.skill.loader",
    "cataforge.interface.cli.doctor.skill_health -> cataforge.runtime.skill.loader",
    "cataforge.interface.cli.doctor.skill_health -> cataforge.domain.docs.indexer",
    "cataforge.runtime.skill.builtins.framework_review.checks.b2 -> cataforge.runtime.skill.loader",
    "cataforge.runtime.skill.builtins.doc_review.checker -> cataforge.runtime.skill.builtins.doc_review.typed_checks",
    # runtime → domain peer imports (both rank-2 layers; allowed by the layer model)
    "cataforge.runtime.skill.builtins.doc_consistency.checker -> cataforge.domain.kg",
    "cataforge.runtime.skill.builtins.doc_consistency.checker -> cataforge.domain.kg._dispatch",
    "cataforge.runtime.skill.builtins.doc_consistency.checker -> cataforge.domain.kg._sparql_utils",
    "cataforge.runtime.skill.builtins.doc_review.checker -> cataforge.domain.kg",
    "cataforge.runtime.skill.builtins.doc_review.checker -> cataforge.domain.kg._dispatch",
]
