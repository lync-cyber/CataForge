schema_version: 2
scope: language
rule_type: e2e
language: java
extensions: [".java"]

# Backdoor patterns — test-only escape hatches that bypass the real user
# input path (Playwright Java / Selenium WebDriver inject via evaluate /
# executeScript). Each match is WARN.
backdoor_patterns:
  - label: "?e2e=1 / ?test=1 query param"
    regex: '\?(?:e2e|test)=1\b'
  - label: "window.__*__ via evaluate"
    regex: 'window\.__\w+__\s*='
  - label: "__E2E__ global"
    regex: '\b__E2E__\b'

# Real-input patterns — genuine user interaction (Playwright locator + Selenium
# WebElement). Layer 1 WARNs when an entire e2e tree has zero matches.
real_input_patterns:
  - regex: '\.click\(\)'
  - regex: '\.sendKeys\('
  - regex: '\.fill\('
  - regex: '\.press\('
  - regex: '\.type\('
