schema_version: 2
scope: language
rule_type: e2e
language: go
extensions: [".go"]

# Backdoor patterns — test-only escape hatches that bypass the real user
# input path (chromedp / go-rod / playwright-go inject via Evaluate). WARN.
backdoor_patterns:
  - label: "?e2e=1 / ?test=1 query param"
    regex: '\?(?:e2e|test)=1\b'
  - label: "window.__*__ via Evaluate"
    regex: 'window\.__\w+__\s*='
  - label: "__E2E__ global"
    regex: '\b__E2E__\b'

# Real-input patterns — genuine user interaction. Layer 1 WARNs when an
# entire e2e tree has zero matches (suite likely injects state instead).
real_input_patterns:
  - regex: '\bchromedp\.Click\('
  - regex: '\bchromedp\.SendKeys\('
  - regex: '\bchromedp\.Submit\('
  - regex: '\.MustClick\(\)'
  - regex: '\.MustInput\('
