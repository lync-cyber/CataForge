schema_version: 1
rule_type: e2e
language: csharp
extensions: [".cs"]

# Backdoor patterns — test-only escape hatches that bypass the real user
# input path (Playwright .NET / Selenium WebDriver inject via
# EvaluateAsync / ExecuteScript). Each match is WARN.
backdoor_patterns:
  - label: "?e2e=1 / ?test=1 query param"
    regex: '\?(?:e2e|test)=1\b'
  - label: "window.__*__ via Evaluate"
    regex: 'window\.__\w+__\s*='
  - label: "__E2E__ global"
    regex: '\b__E2E__\b'

# Real-input patterns — genuine user interaction (Playwright async + Selenium
# sync). Layer 1 WARNs when an entire e2e tree has zero matches.
real_input_patterns:
  - regex: '\.ClickAsync\('
  - regex: '\.FillAsync\('
  - regex: '\.PressAsync\('
  - regex: '\.PressSequentiallyAsync\('
  - regex: '\.Click\(\)'
  - regex: '\.SendKeys\('
