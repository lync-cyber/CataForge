schema_version: 1
rule_type: e2e
language: js-ts
extensions: [".js", ".ts", ".jsx", ".tsx", ".mjs", ".cjs"]

# Backdoor patterns — test-only escape hatches that bypass the real
# user input path (Playwright / Cypress / Puppeteer / Selenium-WDIO).
# Each match is WARN.
backdoor_patterns:
  - label: "window.__*__"
    regex: 'window\.__\w+__\s*='
  - label: "?e2e=1 / ?test=1"
    regex: '\?(?:e2e|test)=1\b'
  - label: "setStore(JSON.parse)"
    regex: 'setStore\s*\([^)]*JSON\.parse'
  - label: "setAst(JSON.parse)"
    regex: 'setAst\s*\([^)]*JSON\.parse'
  - label: "__E2E__ global"
    regex: '\b__E2E__\b\s*='

# Real-input patterns — calls that constitute genuine user interaction.
# Layer 1 emits WARN if an entire e2e tree has zero matches in this set
# (suite is likely fixture-injecting state instead of typing).
real_input_patterns:
  - regex: '\bkeyboard\.type\('
  - regex: '\bpage\.fill\('
  - regex: '\bpage\.click\('
  - regex: '\bpage\.press\('
  - regex: '\bpage\.type\('
  - regex: '\.type\s*\(\s*[''\"]'
