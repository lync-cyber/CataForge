schema_version: 2
scope: language
rule_type: wiring
language: rust
extensions: [".rs"]

# Unwired / stub implementations — the todo!/unimplemented! macros and
# not-implemented panics are Rust's canonical placeholders. Each line
# match is WARN.
empty_handler_patterns:
  - label: "todo! macro"
    regex: '\btodo!\s*\('
  - label: "unimplemented! macro"
    regex: '\bunimplemented!\s*\('
  - label: "panic not-implemented stub"
    regex: 'panic!\s*\(\s*"(?:not implemented|TODO|unimplemented)'
    flags: ["IGNORECASE"]
