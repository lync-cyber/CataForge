schema_version: 1
rule_type: wiring
language: python
extensions: [".py"]

# Python wiring placeholder — empty-handler patterns are rare in Python
# UI codebases (PyQt/Kivy/etc. typically use module-level callbacks
# rather than inline lambdas as event-handler args). Layer 2 AI semantic
# review covers the cross-cutting case; uncomment / extend below when a
# concrete downstream Python project surfaces a recurring anti-pattern.
empty_handler_patterns: []

placeholder_pragma:
  regex: '(?://|#|--|/\*)\s*cataforge:\s*wiring-placeholder'
  flags: ["IGNORECASE"]
