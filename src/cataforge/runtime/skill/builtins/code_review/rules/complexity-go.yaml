schema_version: 2
scope: language
rule_type: complexity
language: go
extensions: [".go"]

function_patterns:
  - label: "func"
    regex: '^func\s+(?:\([^)]*\)\s+)?(\w+)\s*\('
branch_patterns:
  - label: "branch keyword"
    regex: '^\s*(?:if|for|switch|select)\b'
  - label: "else-if chain"
    regex: '\}\s*else\s+if\b'
  - label: "case arm"
    regex: '^\s*(?:case\s|default\s*:)'
  - label: "logical operator"
    regex: '&&|\|\|'
