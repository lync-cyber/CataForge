schema_version: 2
scope: language
rule_type: complexity
language: csharp
extensions: [".cs"]

function_patterns:
  - label: "method declaration"
    regex: '^\s+(?:(?:public|private|protected|internal|static|virtual|override|sealed|async|partial|extern)\s+)+[\w<>\[\],\s.?]+?\s+(\w+)\s*\([^;]*\)\s*(?:where\b[^{]*)?\{'
branch_patterns:
  - label: "branch keyword"
    regex: '\b(?:if|for|foreach|while|switch|catch|do)\s*[({]'
  - label: "case arm"
    regex: '^\s*(?:case\s|default\s*:)'
  - label: "logical operator"
    regex: '&&|\|\|'
