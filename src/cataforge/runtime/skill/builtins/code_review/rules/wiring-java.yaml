schema_version: 2
scope: language
rule_type: wiring
language: java
extensions: [".java"]

# Unwired / stub implementations — UnsupportedOperationException and
# not-implemented runtime throws are Java's scaffold defaults; empty
# listener bodies (Swing/Android) leave events unhandled. Each match is WARN.
empty_handler_patterns:
  - label: "UnsupportedOperationException stub"
    regex: 'throw\s+new\s+UnsupportedOperationException'
  - label: "not-implemented RuntimeException stub"
    regex: 'throw\s+new\s+RuntimeException\(\s*"(?:not implemented|TODO|unimplemented)'
    flags: ["IGNORECASE"]
  - label: "empty listener body"
    regex: 'public\s+void\s+(?:onClick|actionPerformed|handle)\s*\([^)]*\)\s*\{\s*\}'
