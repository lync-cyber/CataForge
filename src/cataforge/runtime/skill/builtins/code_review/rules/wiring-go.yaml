schema_version: 2
scope: language
rule_type: wiring
language: go
extensions: [".go"]

# Unwired / stub implementations — code that looks implemented but is a
# placeholder. LLM-generated Go favours the happy path and leaves panic
# stubs or empty HTTP handlers behind. Each line match is WARN.
empty_handler_patterns:
  - label: "panic not-implemented stub"
    regex: 'panic\(\s*"(?:not implemented|TODO|unimplemented)'
    flags: ["IGNORECASE"]
  - label: "empty http handler body"
    regex: 'func\s*\([^)]*http\.ResponseWriter[^)]*\)\s*\{\s*\}'
